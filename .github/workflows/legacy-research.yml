name: Legacy compatibility research
on:
  push:
    branches: ['research/itd-cookies-wp50-feasibility']
  pull_request:
    paths: ['tests/integration/legacy-bootstrap-guard.php', '.github/workflows/legacy-research.yml']
permissions:
  contents: read
jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {wordpress: '5.0', php: '7.3', mode: guard}
          - {wordpress: '5.0.30', php: '7.3', mode: guard}
          - {wordpress: '5.0.30', php: '7.4', mode: guard-experimental-core}
          - {wordpress: '5.1.27', php: '7.3', mode: guard}
          - {wordpress: '5.2.24', php: '7.3', mode: guard}
          - {wordpress: '5.3.26', php: '7.4', mode: functional}
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_ROOT_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli
          coverage: none
          tools: wp-cli
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm run build:i18n && npm run build
      - name: Disposable Core and unchanged package
        shell: bash
        run: |
          set -Eeuo pipefail
          wp_path="$RUNNER_TEMP/wordpress"
          wp core download --path="$wp_path" --version='${{ matrix.wordpress }}'
          wp config create --path="$wp_path" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_DEBUG true --raw --path="$wp_path"
          wp config set WP_DEBUG_LOG true --raw --path="$wp_path"
          wp config set WP_DEBUG_DISPLAY false --raw --path="$wp_path"
          wp core install --path="$wp_path" --url=http://wordpress.test --title='Legacy feasibility only' --admin_user=admin --admin_password=disposable-ci-only --admin_email=qa@example.test --skip-email
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          unzip "dist/itd-cookies-$version.zip" -d "$wp_path/wp-content/plugins"
          if [[ '${{ matrix.mode }}' != functional ]]; then
            ITD_RUNTIME_FILE="$wp_path/wp-content/plugins/itd-cookies/itd-cookies.php" wp eval-file "$GITHUB_WORKSPACE/tests/integration/legacy-bootstrap-guard.php" --path="$wp_path"
            exit 0
          fi
          install -d "$wp_path/wp-content/languages"
          cp languages/itd-cookies-ru_RU.mo "$wp_path/wp-content/languages/ru_RU.mo"
          wp option update WPLANG ru_RU --path="$wp_path"
          wp option update itd_modubricks_settings '{"enabled":1,"banner_title":"Legacy consent title","banner_text":"Legacy description","banner_text_size":"standard","metrika_enabled":1,"metrika_id":"12345678","ga4_enabled":1,"ga4_measurement_id":"G-TEST12345","consent_version":"legacy-policy-1"}' --format=json --path="$wp_path"
          wp plugin activate itd-cookies --path="$wp_path"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/itd-cookies-wordpress-smoke.php" --path="$wp_path"
          wp plugin deactivate itd-cookies --path="$wp_path"
          wp plugin activate itd-cookies --path="$wp_path"
          CHECK_PERSISTED=1 wp eval-file "$GITHUB_WORKSPACE/tests/integration/itd-cookies-wordpress-smoke.php" --path="$wp_path"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/updater-refresh-wordpress-smoke.php" --path="$wp_path"
          PACKAGE_PATH="$GITHUB_WORKSPACE/dist/itd-cookies-$version.zip" wp eval-file "$GITHUB_WORKSPACE/tests/integration/updater-wordpress-smoke.php" --path="$wp_path"
          for scenario in zero supported missing-handle missing-dependency cycle ownership ancillary unprinted late; do
            ADAPTER_SCENARIO="$scenario" wp eval-file "$GITHUB_WORKSPACE/tests/integration/script-adapters-wordpress-smoke.php" --path="$wp_path"
          done
          if [[ -f "$wp_path/wp-content/debug.log" ]] && grep -Ei 'itd-cookies.*(fatal|warning|deprecated)|(fatal|warning|deprecated).*itd-cookies' "$wp_path/wp-content/debug.log"; then exit 1; fi
